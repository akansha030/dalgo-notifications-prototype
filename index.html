<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dalgo · Notifications prototype (review fixes)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: { primary: '#00897B' }, fontFamily: { sans: ['Anek Latin', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } },
  };
</script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body, #root { height: 100%; }
  body { margin: 0; font-family: 'Anek Latin', sans-serif; background: #fff; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel-src" id="app-src">
const { useState, useMemo } = React;

/* ── icons ── */
const ICONS = {
  'bell': '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  'settings': '<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
  'alert-circle': '<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',
  'list-filter': '<path d="M3 6h18"/><path d="M7 12h10"/><path d="M10 18h4"/>',
  'chevron-down': '<path d="m6 9 6 6 6-6"/>',
  'chevron-left': '<path d="m15 18-6-6 6-6"/>',
  'chevron-right': '<path d="m9 18 6-6-6-6"/>',
  'x': '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  'inbox': '<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  'check': '<path d="M20 6 9 17l-5-5"/>',
};
function Icon({ name, className }) {
  return <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" dangerouslySetInnerHTML={{ __html: ICONS[name] || '' }} />;
}
const cn = (...a) => a.filter(Boolean).join(' ');

function Checkbox({ checked, onChange, className, ariaLabel }) {
  const on = checked === true, ind = checked === 'indeterminate';
  return (
    <button type="button" role="checkbox" aria-checked={ind ? 'mixed' : on} aria-label={ariaLabel}
      onClick={() => onChange(!on)}
      className={cn('flex h-4 w-4 shrink-0 items-center justify-center rounded border transition', (on || ind) ? 'border-gray-900 bg-gray-900 text-white' : 'border-gray-400 bg-white hover:border-gray-600', className)}>
      {on && <Icon name="check" className="h-3 w-3" />}
      {ind && <span className="h-0.5 w-2 rounded bg-white" />}
    </button>
  );
}

/* ── data ── */
const CATEGORY_META = {
  pipeline: { label: 'Pipeline', group: 'data' },
  schema_change: { label: 'Schema change', group: 'data' },
  sharing: { label: 'Sharing', group: 'collab' },
  access: { label: 'Access', group: 'collab' },
  mention: { label: 'Mention', group: 'collab' },
  platform: { label: 'Platform', group: 'platform' },
  announcement: { label: 'Announcement', group: 'platform' },
};
const TYPE_FILTERS = [
  { key: 'all', label: 'All types' },
  { key: 'data', label: 'Data & pipeline', hint: 'Pipeline, Schema change' },
  { key: 'collab', label: 'Collaboration', hint: 'Sharing, Access, Mention' },
  { key: 'platform', label: 'Platform', hint: 'Platform, Announcement' },
];
const TRUNCATE = 150, PAGE_SIZE = 4;
const mins = (n) => new Date(Date.now() - n * 60000).toISOString();
const SEED = [
  { id: 1, category: 'schema_change', urgent: true, read: false, ts: mins(8), message: 'A column (customer_region) was dropped from the orders table during the last sync. 3 downstream models reference it and may fail on the next run — review and update them before 9:00 PM.' },
  { id: 2, category: 'pipeline', urgent: false, read: false, ts: mins(21), message: 'Your daily_ingest pipeline failed at 02:14 — connection timeout to the Postgres source.' },
  { id: 3, category: 'platform', urgent: true, read: false, ts: mins(34), message: 'We are removing the Elementary data-quality feature on 30 Oct. Export any saved checks before then.' },
  { id: 4, category: 'mention', urgent: false, read: false, ts: mins(55), message: 'Priya mentioned you in a comment on the "Health Sector" dashboard: "can you confirm the Q3 numbers?"' },
  { id: 5, category: 'platform', urgent: false, read: true, ts: mins(90), message: 'Please expect downtime from 8–10 PM today. We are upgrading Airbyte to the latest version, which may briefly interrupt running syncs. No action is needed on your side — pipelines will resume automatically once the upgrade is complete.' },
  { id: 6, category: 'access', urgent: false, read: true, ts: mins(140), message: 'Your role was changed to Analyst by the workspace admin.' },
  { id: 7, category: 'announcement', urgent: false, read: true, ts: mins(220), message: 'Dalgo 2.1 is live — faster dashboards and the new Copilot are now available to your whole team.' },
];
function timeAgo(iso) {
  const m = Math.max(1, Math.round((Date.now() - new Date(iso)) / 60000));
  if (m < 60) return `${m} minute${m !== 1 ? 's' : ''} ago`;
  const h = Math.round(m / 60);
  if (h < 24) return `about ${h} hour${h !== 1 ? 's' : ''} ago`;
  const d = Math.round(h / 24);
  return `${d} day${d !== 1 ? 's' : ''} ago`;
}

function App() {
  const [notes, setNotes] = useState(SEED);
  const [tab, setTab] = useState('all');
  const [typeFilter, setTypeFilter] = useState('all');
  const [selected, setSelected] = useState([]);
  const [allPages, setAllPages] = useState(false);
  const [expanded, setExpanded] = useState([]);
  const [page, setPage] = useState(1);
  const [filterOpen, setFilterOpen] = useState(false);

  const unreadCount = notes.filter((n) => !n.read).length;

  const filtered = useMemo(() => notes.filter((n) => {
    if (tab === 'read' && !n.read) return false;
    if (tab === 'unread' && n.read) return false;
    if (typeFilter !== 'all' && CATEGORY_META[n.category].group !== typeFilter) return false;
    return true;
  }), [notes, tab, typeFilter]);

  const pageCount = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  const safePage = Math.min(page, pageCount);
  const start = (safePage - 1) * PAGE_SIZE;
  const pageItems = filtered.slice(start, start + PAGE_SIZE);

  const filteredIds = filtered.map((n) => n.id);
  const pageIds = pageItems.map((n) => n.id);
  const selectedInFilter = allPages ? filteredIds : selected.filter((id) => filteredIds.includes(id));
  const selectedCount = selectedInFilter.length;
  const hasSelection = selectedCount > 0;
  const allOnPageSelected = pageIds.length > 0 && pageIds.every((id) => selectedInFilter.includes(id));
  const someOnPage = !allOnPageSelected && pageIds.some((id) => selectedInFilter.includes(id));
  const showSelectAllPages = allOnPageSelected && !allPages && filtered.length > pageItems.length;

  const reset = () => { setSelected([]); setAllPages(false); };
  const resetToFirst = () => { reset(); setPage(1); };
  const setRead = (ids, read) => setNotes((prev) => prev.map((n) => (ids.includes(n.id) ? { ...n, read } : n)));
  const markSelected = (read) => { setRead(allPages ? filteredIds : selectedInFilter, read); reset(); };
  const toggleSelectAllOnPage = (checked) => {
    if (checked) setSelected((prev) => Array.from(new Set([...prev, ...pageIds])));
    else { setAllPages(false); setSelected((prev) => prev.filter((id) => !pageIds.includes(id))); }
  };
  const toggleRow = (id, checked) => {
    if (allPages && !checked) { setAllPages(false); setSelected(filteredIds.filter((x) => x !== id)); }
    else setSelected((prev) => (checked ? [...prev, id] : prev.filter((x) => x !== id)));
  };
  const activeType = TYPE_FILTERS.find((t) => t.key === typeFilter);

  return (
    <div className="flex h-full flex-col bg-[#F7F8FA]">
      {/* global header */}
      <header className="flex items-center justify-between border-b bg-white px-5 py-2.5">
        <div className="text-2xl font-bold text-gray-900">Dalgo</div>
        <div className="flex items-center gap-3 text-sm text-gray-600">
          <Icon name="bell" className="h-5 w-5" />
          <span className="font-medium text-gray-800">Dalgo postgres</span>
          <span className="flex h-8 w-8 items-center justify-center rounded-full bg-primary/10 text-xs font-semibold text-primary">AM</span>
        </div>
      </header>

      <div className="flex h-full min-h-0 flex-col">
        {/* page header */}
        <div className="flex-shrink-0 border-b bg-white">
          <div className="mb-5 flex items-start justify-between p-6 pb-0">
            <div>
              <div className="flex items-center gap-3">
                <h1 className="text-3xl font-bold">Notifications</h1>
                {unreadCount > 0 && <span className="rounded-md bg-teal-600 px-2.5 py-0.5 text-xs font-medium text-white">{unreadCount}</span>}
              </div>
              <p className="mt-1 text-gray-500">View and manage your notifications</p>
            </div>
            <button className="flex h-9 w-9 items-center justify-center rounded-md text-gray-500 hover:bg-gray-100 hover:text-gray-700" aria-label="Manage preferences">
              <Icon name="settings" className="h-5 w-5" />
            </button>
          </div>

          {/* tabs + concise type filter */}
          <div className="flex items-center justify-between px-6">
            <div className="flex gap-4">
              {['all', 'read', 'unread'].map((t) => (
                <button key={t} onClick={() => { setTab(t); resetToFirst(); }}
                  className={cn('relative px-1 py-2.5 text-sm font-medium uppercase tracking-wide', tab === t ? 'text-teal-600' : 'text-gray-500 hover:text-gray-700')}>
                  {t}
                  {tab === t && <span className="absolute inset-x-0 bottom-0 h-0.5 bg-teal-600" />}
                </button>
              ))}
            </div>

            <div className="relative">
              <button onClick={() => setFilterOpen((o) => !o)} className="flex h-8 items-center gap-1.5 rounded px-2 text-sm text-gray-600 hover:bg-gray-100">
                <Icon name="list-filter" className="h-4 w-4" />
                {activeType.key === 'all' ? 'All types' : activeType.label}
                <Icon name="chevron-down" className="h-3.5 w-3.5 text-gray-400" />
              </button>
              {filterOpen && (
                <>
                  <div className="fixed inset-0 z-30" onClick={() => setFilterOpen(false)} />
                  <div className="absolute right-0 z-40 mt-1 w-56 rounded-lg border bg-white p-1 shadow-xl">
                    <div className="px-2 py-1 text-xs text-gray-500">Filter by type</div>
                    <div className="my-1 border-t" />
                    {TYPE_FILTERS.map((t) => (
                      <button key={t.key} onClick={() => { setTypeFilter(t.key); resetToFirst(); setFilterOpen(false); }}
                        className="flex w-full items-start justify-between rounded px-2 py-1.5 text-left hover:bg-gray-100">
                        <span>
                          <span className="block text-sm">{t.label}</span>
                          {t.hint && <span className="block text-[11px] text-gray-400">{t.hint}</span>}
                        </span>
                        {typeFilter === t.key && <Icon name="check" className="mt-0.5 h-4 w-4 text-teal-600" />}
                      </button>
                    ))}
                  </div>
                </>
              )}
            </div>
          </div>
        </div>

        {/* list */}
        <div className="min-h-0 flex-1 px-6 pt-4 pb-6">
          <div className="flex h-full flex-col overflow-hidden rounded-lg border bg-white shadow-sm">
            {/* selection bar */}
            <div className="flex items-center justify-between border-b bg-gray-50 px-4 py-3">
              <div className="flex min-w-0 items-center gap-3">
                <Checkbox checked={allOnPageSelected ? true : someOnPage ? 'indeterminate' : false} onChange={toggleSelectAllOnPage} ariaLabel="Select all on this page" />
                {hasSelection ? (
                  <span className="truncate text-sm font-medium text-gray-700">
                    {allPages ? `All ${selectedCount} selected` : `${selectedCount} selected`}
                    {showSelectAllPages && (
                      <button onClick={() => setAllPages(true)} className="ml-2 font-medium text-teal-600 hover:text-teal-700 hover:underline">
                        Select all {filtered.length} across all pages
                      </button>
                    )}
                    {allPages && <button onClick={reset} className="ml-2 font-medium text-gray-500 hover:text-gray-700 hover:underline">Clear</button>}
                  </span>
                ) : (
                  <span className="text-sm font-medium text-gray-700">
                    Select all<span className="mx-2 text-gray-400">|</span>
                    Showing {pageItems.length} of {filtered.length} notifications
                  </span>
                )}
              </div>
              {hasSelection && (
                <div className="flex flex-shrink-0 items-center gap-1">
                  <button onClick={() => markSelected(true)} className="rounded px-2 py-1 text-sm font-medium text-teal-700 hover:bg-teal-50">Mark as read</button>
                  <button onClick={() => markSelected(false)} className="rounded px-2 py-1 text-sm font-medium text-gray-600 hover:bg-gray-100">Mark as unread</button>
                  <button onClick={reset} className="rounded p-1 hover:bg-gray-200" aria-label="Clear selection"><Icon name="x" className="h-4 w-4 text-gray-500" /></button>
                </div>
              )}
            </div>

            {/* rows */}
            <div className="flex-1 overflow-y-auto">
              {pageItems.length === 0 ? (
                <div className="flex h-full flex-col items-center justify-center gap-3 py-16 text-center">
                  <div className="flex h-14 w-14 items-center justify-center rounded-full bg-gray-100"><Icon name="inbox" className="h-7 w-7 text-gray-400" /></div>
                  <p className="text-sm text-gray-500">Nothing here for this filter.</p>
                </div>
              ) : pageItems.map((n) => (
                <Row key={n.id} note={n}
                  selected={selectedInFilter.includes(n.id)}
                  expanded={expanded.includes(n.id)}
                  onSelect={(c) => toggleRow(n.id, c)}
                  onToggle={() => setExpanded((prev) => (prev.includes(n.id) ? prev.filter((x) => x !== n.id) : [...prev, n.id]))} />
              ))}
            </div>

            {/* pagination */}
            <div className="flex items-center justify-between border-t px-4 py-2 text-sm text-gray-500">
              <span>{filtered.length === 0 ? 0 : start + 1}–{Math.min(start + PAGE_SIZE, filtered.length)} of {filtered.length}</span>
              <div className="flex items-center gap-1">
                <button disabled={safePage <= 1} onClick={() => setPage((p) => Math.max(1, p - 1))} className="rounded p-1.5 enabled:hover:bg-gray-100 disabled:opacity-40" aria-label="Previous page"><Icon name="chevron-left" className="h-4 w-4" /></button>
                <span className="px-1">Page {safePage} of {pageCount}</span>
                <button disabled={safePage >= pageCount} onClick={() => setPage((p) => Math.min(pageCount, p + 1))} className="rounded p-1.5 enabled:hover:bg-gray-100 disabled:opacity-40" aria-label="Next page"><Icon name="chevron-right" className="h-4 w-4" /></button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function Row({ note: n, selected, expanded, onSelect, onToggle }) {
  const long = n.message.length > TRUNCATE;
  const shown = !expanded && long ? n.message.slice(0, TRUNCATE).trimEnd() + '…' : n.message;
  return (
    <div className={cn('flex gap-3 border-b px-4 py-4 last:border-b-0', n.read ? 'bg-gray-50/60 hover:bg-gray-100/60' : 'bg-white hover:bg-gray-50/60')}>
      <Checkbox checked={selected} onChange={onSelect} ariaLabel={`Select notification ${n.id}`} className="mt-1" />
      <div className="min-w-0 flex-1">
        <p className={cn('text-base leading-relaxed', n.read ? 'font-normal text-gray-500' : 'font-medium text-gray-800')}>
          {shown}
          {long && <button onClick={onToggle} className="ml-1.5 whitespace-nowrap font-medium text-teal-600 hover:text-teal-700 hover:underline">{expanded ? 'See less' : 'See more'}</button>}
        </p>
        <div className="mt-2 flex flex-wrap items-center gap-2">
          <span className={cn('text-sm', n.read ? 'text-gray-400' : 'text-gray-600')}>{timeAgo(n.ts)}</span>
          <span className="rounded-full border border-teal-100 bg-teal-50 px-2 py-0.5 text-xs font-medium text-teal-700">{CATEGORY_META[n.category].label}</span>
          {n.urgent && (
            <span className="inline-flex items-center gap-1 rounded-full border border-red-100 bg-red-50 px-2 py-0.5 text-xs font-medium text-red-600">
              <Icon name="alert-circle" className="h-3.5 w-3.5" /> Urgent
            </span>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
  (function () {
    var src = document.getElementById('app-src').textContent;
    var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
    var s = document.createElement('script');
    s.textContent = out;
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
